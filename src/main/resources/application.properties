spring.application.name=gestioncontacts

# Configuration de la base de données PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestioncontact}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuration des fichiers uploadés
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Dossier pour stocker les fichiers
file.upload-dir=./uploads/
spring.main.allow-circular-references=true
# Activer les logs détaillés pour Spring Security
logging.level.org.springframework.security=INFO
# Pour votre package spécifique
logging.level.com.anderson.gestioncontacts=INFO

# Clé de signature des jetons JWT : obligatoire, 32 caractères minimum (variable JWT_SECRET)
jwt.secret=${JWT_SECRET:}
